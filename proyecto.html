<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- El <title> se actualiza dinámicamente por JS según el proyecto -->
  <title>Proyecto — Modern Space</title>
  <meta name="description" content="Detalle de proyecto — Modern Space · Diseño que acompaña" />
  <link rel="icon" type="image/png" href="Modern%20Space/Pagina%20Web/Logos%20sin%20fondo/Letras%20negras.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       TABLA DE CONTENIDOS — CSS (proyecto.html)
       1.  Variables (mismas que index.html)
       2.  Reset y base
       3.  Navbar
       4.  Botón volver
       5.  Hero del proyecto
       6.  Sección de información
       7.  Sección de galería (spread catálogo)
       8.  CTA solicitar
       9.  Footer
       10. Estado de error (id inválido)
       11. Responsive
    ============================================================ */


    /* ─── 1. VARIABLES ── Mismas que index.html ─────────────── */
    :root {
      --cream:      #F2EDE0;
      --cream-dark: #E5DDD0;
      --gold:       #B89B5E;
      --gold-light: #D4B97A;
      --dark:       #1C1C1C;
      --dark-mid:   #2A2A2A;
      --charcoal:   #3D3D3D;
      --text-body:  #4A4545;
      --text-muted: #8A8075;
      --white:      #FFFFFF;

      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans:  'Inter', system-ui, sans-serif;

      --t-fast:      0.18s ease-out;
      --t-base:      0.26s ease-out;
      --ease-out:    cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    }


    /* ─── 2. RESET Y BASE ────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: var(--font-sans);
      background: var(--cream);
      color: var(--text-body);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    img  { display: block; max-width: 100%; height: auto; }
    a    { text-decoration: none; color: inherit; }
    ul   { list-style: none; padding: 0; margin: 0; }

    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 40px;
    }


    /* ─── 3. NAVBAR ─── igual que index.html ────────────────── */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 22px 0;
      background: var(--white);
      box-shadow: 0 1px 24px rgba(0,0,0,0.08);
    }

    .navbar__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .navbar__logo img { height: 160px; width: auto; }

    .navbar__links {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .navbar__links a {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--charcoal);
      position: relative;
      transition: color var(--t-fast);
    }
    .navbar__links a::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0;
      width: 0; height: 1.5px;
      background: var(--gold);
      transition: width var(--t-base);
    }
    .navbar__links a:hover { color: var(--dark); }
    .navbar__links a:hover::after { width: 100%; }

    /* Hamburger (móvil) */
    .navbar__burger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 34px; height: 34px;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .navbar__burger span {
      display: block;
      height: 1.5px;
      background: var(--dark);
      transition: transform var(--t-base), opacity var(--t-fast);
      transform-origin: center;
    }
    .navbar__burger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .navbar__burger.open span:nth-child(2) { opacity: 0; }
    .navbar__burger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    /* Menú overlay móvil */
    .navbar__mobile {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--dark);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.32s var(--ease-out), visibility 0.32s;
    }
    .navbar__mobile.open { opacity: 1; visibility: visible; pointer-events: all; }
    .navbar__mobile a {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 2rem;
      color: var(--white);
      opacity: 0;
      transform: translateY(18px);
      transition: color var(--t-fast), opacity 0.38s var(--ease-out), transform 0.38s var(--ease-out);
    }
    .navbar__mobile.open a { opacity: 1; transform: translateY(0); }
    .navbar__mobile.open a:nth-child(1) { transition-delay: 0.06s; }
    .navbar__mobile.open a:nth-child(2) { transition-delay: 0.12s; }
    .navbar__mobile.open a:nth-child(3) { transition-delay: 0.18s; }
    .navbar__mobile.open a:nth-child(4) { transition-delay: 0.24s; }
    .navbar__mobile.open a:nth-child(5) { transition-delay: 0.30s; }
    .navbar__mobile a:hover { color: var(--gold); }


    /* ─── 4. BOTÓN VOLVER ────────────────────────────────────── */
    /* Aparece justo debajo de la navbar, sobre el hero.
       Siempre apunta a index.html#proyectos. */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--white);
      padding: 14px 24px;
      background: rgba(28,28,28,0.55);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      position: absolute;
      top: 90px;
      left: 40px;
      z-index: 10;
      transition: background var(--t-fast), border-color var(--t-fast), transform 160ms ease-out;
      animation: detailFadeIn 0.6s var(--ease-out) 0.1s both;
    }
    .btn-back:hover  { background: rgba(184,155,94,0.75); border-color: transparent; }
    .btn-back:active { transform: scale(0.97); }
    .btn-back svg { flex-shrink: 0; }


    /* ─── 5. HERO DEL PROYECTO ───────────────────────────────── */
    /* Imagen principal a pantalla completa con overlay gradiente. */
    .detail-hero {
      position: relative;
      height: 85vh;
      min-height: 520px;
      overflow: hidden;
      margin-top: 76px; /* offset de la navbar fija */
    }

    .detail-hero__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .detail-hero__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(10,10,10,0.75) 0%,
        rgba(10,10,10,0.2) 60%,
        transparent 100%
      );
    }

    /* Tag de categoría sobre el hero */
    .detail-hero__tag {
      position: absolute;
      top: 32px; right: 40px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(10,10,10,0.6);
      backdrop-filter: blur(4px);
      padding: 8px 16px;
      animation: detailFadeIn 0.7s var(--ease-out) 0.15s both;
    }

    /* Hero entrada */
    @keyframes detailFadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes detailFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Título e info dentro del hero (esquina inferior izquierda) */
    .detail-hero__caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 48px 40px;
      z-index: 2;
    }

    .detail-hero__title {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 400;
      color: var(--white);
      line-height: 1.1;
      margin-bottom: 12px;
      animation: detailFadeUp 0.8s var(--ease-out) 0.25s both;
    }

    .detail-hero__meta {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      animation: detailFadeUp 0.7s var(--ease-out) 0.42s both;
    }


    /* ─── 6. INFORMACIÓN DEL PROYECTO ───────────────────────── */
    /* 2 columnas: descripción izquierda, características derecha.
       Fondo crema. */
    .detail-info {
      padding: 100px 0;
      background: var(--cream);
    }

    .detail-info__grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 80px;
      align-items: start;
    }

    .detail-info__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
    }

    .detail-info__quote {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      font-weight: 400;
      color: var(--dark);
      line-height: 1.4;
      margin-bottom: 28px;
    }

    .detail-info__desc {
      font-size: 0.975rem;
      line-height: 1.8;
      color: var(--text-body);
    }

    /* Columna derecha: datos + features */
    .detail-info__meta-block {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .detail-info__data {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding-bottom: 32px;
      border-bottom: 1px solid rgba(184,155,94,0.25);
    }

    .data-item__key {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .data-item__val {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--dark);
    }

    /* Lista de características del proyecto */
    .detail-features__title {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--dark);
      margin-bottom: 20px;
    }

    .detail-features__list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .detail-features__list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-body);
      opacity: 0;
      transform: translateX(-16px);
      transition: opacity 0.5s var(--ease-out), transform 0.5s var(--ease-out);
    }
    .detail-features__list.visible li { opacity: 1; transform: translateX(0); }
    .detail-features__list.visible li:nth-child(1) { transition-delay: 0.05s; }
    .detail-features__list.visible li:nth-child(2) { transition-delay: 0.12s; }
    .detail-features__list.visible li:nth-child(3) { transition-delay: 0.19s; }
    .detail-features__list.visible li:nth-child(4) { transition-delay: 0.26s; }
    .detail-features__list.visible li:nth-child(5) { transition-delay: 0.33s; }

    /* Guion dorado antes de cada característica */
    .detail-features__list li::before {
      content: '—';
      color: var(--gold);
      flex-shrink: 0;
      font-weight: 600;
    }


    /* ─── 7. GALERÍA DE FOTOS ───────────────────────────────── */
    .detail-gallery {
      background: var(--dark-mid, #2A2A2A);
      padding: 80px 0;
    }

    .detail-gallery__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(184,155,94,0.7);
      margin-bottom: 32px;
      text-align: center;
    }

    .detail-gallery__grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .detail-gallery__photo {
      overflow: hidden;
      aspect-ratio: 4 / 3;
      cursor: zoom-in;
    }

    .detail-gallery__photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
    }

    @media (hover: hover) and (pointer: fine) {
      .detail-gallery__photo:hover img { transform: scale(1.06); }
    }


    /* ─── 8. CTA SOLICITAR ───────────────────────────────────── */
    .detail-cta {
      padding: 100px 0;
      background: var(--cream);
      text-align: center;
    }

    .detail-cta__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
    }

    .detail-cta__title {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      font-weight: 400;
      color: var(--dark);
      line-height: 1.2;
      margin-bottom: 40px;
    }

    .detail-cta__actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Botón primario */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--white);
      background: var(--dark);
      padding: 16px 36px;
      transition: background var(--t-fast), transform 160ms ease-out;
    }
    .btn-primary:hover  { background: var(--gold); }
    .btn-primary:active { transform: scale(0.97); }

    /* Botón outline */
    .btn-outline {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dark);
      border: 1.5px solid var(--dark);
      padding: 15px 35px;
      transition: background var(--t-fast), color var(--t-fast), transform 160ms ease-out;
    }
    .btn-outline:hover  { background: var(--dark); color: var(--white); }
    .btn-outline:active { transform: scale(0.97); }


    /* ─── 9. FOOTER (mínimo) ─────────────────────────────────── */
    .footer-min {
      background: var(--dark);
      padding: 40px 0;
    }

    .footer-min__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .footer-min img { height: 60px; }

    .footer-min__copy {
      font-size: 12px;
      color: rgba(255,255,255,0.25);
    }

    .footer-min__cats {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }


    /* ─── 10. ESTADO DE ERROR (id inválido) ──────────────────── */
    /* Se muestra si el ?id= no existe en el objeto de proyectos. */
    .error-state {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      margin-top: 76px;
    }

    .error-state__number {
      font-family: var(--font-serif);
      font-size: 8rem;
      font-weight: 600;
      color: rgba(184,155,94,0.15);
      line-height: 1;
      margin-bottom: 24px;
    }

    .error-state__title {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 2rem;
      color: var(--dark);
      margin-bottom: 16px;
    }

    .error-state__desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 40px;
    }


    /* ─── 11. RESPONSIVE ──────────────────────────────────────── */

    @media (max-width: 1024px) {
      .container { padding: 0 28px; }
      .detail-info__grid { gap: 48px; }
      .btn-back { left: 28px; }
      .detail-hero__caption { padding: 40px 28px; }
    }

    @media (max-width: 768px) {
      .container { padding: 0 20px; }
      .navbar__links { display: none; }
      .navbar__burger { display: flex; }

      .btn-back { top: 80px; left: 20px; padding: 10px 16px; font-size: 11px; }

      .detail-hero { height: 65vh; }
      .detail-hero__caption { padding: 32px 20px; }
      .detail-hero__tag { top: 20px; right: 20px; }

      .detail-info { padding: 64px 0; }
      .detail-info__grid { grid-template-columns: 1fr; gap: 48px; }

      .detail-info__data { grid-template-columns: 1fr 1fr; }

      .detail-gallery { padding: 56px 0; }
      .detail-gallery__grid { grid-template-columns: repeat(2, 1fr); }

      .detail-cta { padding: 64px 0; }

      .footer-min__inner { flex-direction: column; text-align: center; gap: 12px; }
      .footer-min__cats { display: none; }
    }

    @media (max-width: 480px) {
      .detail-hero__title { font-size: 1.8rem; }
      .detail-info__data { grid-template-columns: 1fr; }
      .detail-cta__actions { flex-direction: column; align-items: stretch; }
      .btn-primary, .btn-outline { justify-content: center; }
      .detail-gallery__grid { grid-template-columns: 1fr; }
    }


    /* ─── LIGHTBOX ──────────────────────────────────────────────── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0, 0, 0, 0.93);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.32s cubic-bezier(0.23, 1, 0.32, 1), visibility 0.32s;
      cursor: zoom-out;
    }
    .lightbox.open {
      opacity: 1;
      visibility: visible;
    }
    .lightbox__img {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      box-shadow: 0 40px 100px rgba(0,0,0,0.6);
      transform: scale(0.94);
      transition: transform 0.38s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .lightbox.open .lightbox__img {
      transform: scale(1);
    }
    .lightbox__close {
      position: absolute;
      top: 20px;
      right: 28px;
      font-size: 36px;
      font-weight: 300;
      line-height: 1;
      color: rgba(255,255,255,0.6);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.18s ease-out, transform 0.22s ease-out;
    }
    .lightbox__close:hover {
      color: var(--gold);
      transform: rotate(90deg);
    }
    .lightbox__prev,
    .lightbox__next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.25);
      color: #fff;
      font-size: 1.4rem;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      z-index: 10;
    }
    .lightbox__prev { left: 24px; }
    .lightbox__next { right: 24px; }
    .lightbox__prev:hover,
    .lightbox__next:hover { background: rgba(184,155,94,0.35); border-color: #B89B5E; }
  </style>
</head>

<body>

  <!-- ============================================================
       NAVBAR — mismo estilo que index.html pero siempre sólida
       (en la página de detalle no hay hero transparente)
  ============================================================ -->
  <nav class="navbar" role="navigation" aria-label="Navegación principal">
    <div class="container">
      <div class="navbar__inner">

        <a href="index.html" class="navbar__logo" aria-label="Modern Space — inicio">
          <img src="Modern%20Space/Pagina%20Web/Logos%20sin%20fondo/Letras%20negras.png" alt="Modern Space" />
        </a>

        <ul class="navbar__links" role="list">
          <li><a href="index.html#inicio">Inicio</a></li>
          <li><a href="index.html#servicios">Servicios</a></li>
          <li><a href="index.html#proyectos">Proyectos</a></li>
          <li><a href="index.html#proceso">Proceso</a></li>
          <li><a href="index.html#contacto">Contacto</a></li>
        </ul>

        <button class="navbar__burger" id="burgerBtn" aria-label="Abrir menú" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

      </div>
    </div>
  </nav>

  <!-- Menú overlay móvil -->
  <div class="navbar__mobile" id="mobileMenu" role="dialog" aria-label="Menú de navegación">
    <a href="index.html#inicio"    onclick="closeMobileMenu()">Inicio</a>
    <a href="index.html#servicios" onclick="closeMobileMenu()">Servicios</a>
    <a href="index.html#proyectos" onclick="closeMobileMenu()">Proyectos</a>
    <a href="index.html#proceso"   onclick="closeMobileMenu()">Proceso</a>
    <a href="index.html#contacto"  onclick="closeMobileMenu()">Contacto</a>
  </div>


  <!-- ============================================================
       CONTENIDO DINÁMICO
       Todo lo que está dentro de #page-content es reemplazado
       por JavaScript según el ?id= de la URL.
       Si el id no existe, se muestra el bloque .error-state.
  ============================================================ -->
  <div id="page-content">
    <!-- Se rellena con JS al cargar la página -->
  </div>


  <!-- Lightbox para galería de fotos -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Foto ampliada" aria-modal="true">
    <button class="lightbox__close" id="lightboxClose" aria-label="Cerrar">&times;</button>

    /* ─── 2. RENDERIZAR PROYECTO ───────────────────────────────
       Lee el ?id= de la URL, busca el proyecto en PROJECTS
       y construye el HTML correspondiente.
       Si el id no existe, muestra el estado de error. */
    function getProjectId() {
      return new URLSearchParams(window.location.search).get('id') || '';
    }

    function renderProject() {
      const id      = getProjectId();
      const project = PROJECTS[id];
      const content = document.getElementById('page-content');

      if (!project) {
        /* ── Estado de error: id inválido o ausente ── */
        content.innerHTML = `
          <div class="error-state">
            <div class="error-state__number">404</div>
            <h1 class="error-state__title">Proyecto no encontrado.</h1>
            <p class="error-state__desc">
              El proyecto que buscas no existe o el enlace no es válido.
            </p>
            <a href="index.html#proyectos" class="btn-primary">
              ← Ver todos los proyectos
            </a>
          </div>
        `;
        return;
      }

      /* ── Actualizar <title> y meta description ── */
      document.title = `${project.title} — Modern Space`;

      const featuresHTML = project.features

        .join('');

      const galleryHTML = (project.galleryImages || [])
        .map(src => `<div class="detail-gallery__photo"><img src="${src}" alt="Galería — ${project.title}" loading="lazy" /></div>`)
        .join('');

      /* ── HTML completo de la página de detalle ── */

    /* Stagger features list cuando entra en viewport */
    function initFeaturesObserver() {
      const list = document.querySelector('.detail-features__list');
      if (!list) return;
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              list.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.2 }
      );
      observer.observe(list);
    }
    setTimeout(initFeaturesObserver, 50);


    /* ─── 3. NAVBAR HAMBURGER ──────────────────────────────────
       Igual que index.html. */
    const burgerBtn  = document.getElementById('burgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');

    burgerBtn.addEventListener('click', () => {
      const isOpen = mobileMenu.classList.toggle('open');
      burgerBtn.classList.toggle('open', isOpen);
      burgerBtn.setAttribute('aria-expanded', isOpen);
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });

    function closeMobileMenu() {
      mobileMenu.classList.remove('open');
      burgerBtn.classList.remove('open');
      burgerBtn.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMobileMenu();
    });


    /* ─── 4. AÑO EN FOOTER ─────────────────────────────────── */
    document.getElementById('currentYear').textContent = new Date().getFullYear();


    /* ─── 5. LIGHTBOX DE GALERÍA ───────────────────────────────
       Abre la foto ampliada al hacer click en cualquier imagen
       del grid de galería. Navegación prev/next con botones y flechas del teclado. */
    const lightbox      = document.getElementById('lightbox');
    const lightboxImg   = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');
    const lightboxPrev  = document.getElementById('lightboxPrev');
    const lightboxNext  = document.getElementById('lightboxNext');

    let galleryImages = [];
    let currentIndex  = 0;

    function getGalleryImages() {
      return Array.from(document.querySelectorAll('.detail-gallery__photo img'));
    }

    function openLightbox(index) {
      galleryImages = getGalleryImages();
      currentIndex  = index;
      lightboxImg.src = galleryImages[currentIndex].src;
      lightboxImg.alt = galleryImages[currentIndex].alt || '';
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
      updateNavButtons();
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    function showImage(index) {
      currentIndex = (index + galleryImages.length) % galleryImages.length;
      lightboxImg.style.opacity = '0';
      setTimeout(() => {
        lightboxImg.src = galleryImages[currentIndex].src;
        lightboxImg.alt = galleryImages[currentIndex].alt || '';
        lightboxImg.style.opacity = '1';
        updateNavButtons();
      }, 150);
    }

    function updateNavButtons() {
      lightboxPrev.style.display = galleryImages.length > 1 ? 'flex' : 'none';
      lightboxNext.style.display = galleryImages.length > 1 ? 'flex' : 'none';
    }

    lightboxImg.style.transition = 'opacity 0.15s ease-out';

    /* Delegado: las fotos se renderizan dinámicamente */
    document.addEventListener('click', (e) => {
      const photo = e.target.closest('.detail-gallery__photo img');
      if (photo) {
        const imgs = getGalleryImages();
        openLightbox(imgs.indexOf(photo));
      }
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    lightboxClose.addEventListener('click', closeLightbox);
    lightboxPrev.addEventListener('click', (e) => { e.stopPropagation(); showImage(currentIndex - 1); });
    lightboxNext.addEventListener('click', (e) => { e.stopPropagation(); showImage(currentIndex + 1); });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape')      closeLightbox();
      if (e.key === 'ArrowLeft')   showImage(currentIndex - 1);
      if (e.key === 'ArrowRight')  showImage(currentIndex + 1);
    });

  </script>
